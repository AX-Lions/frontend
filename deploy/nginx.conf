# Bordo 프론트 서빙 + 백엔드 프록시.
#
# 프론트와 백엔드가 같은 도메인을 씁니다. 라우팅을 Cloudflare 대시보드가 아니라
# 여기에 두는 이유는 두 가지입니다.
#   1. 설정이 저장소에 남아 리뷰되고, 대회 측 서버로 옮길 때 그대로 따라갑니다
#   2. 같은 출처가 되어 CORS 설정이 필요 없습니다
#
# 터널은 이 서버(8020)로만 붙이면 됩니다.

server {
    listen 8020;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 터널이 넘겨주는 원래 클라이언트 IP 를 로그에 남깁니다.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # 응답 크기를 줄입니다. 라즈베리파이의 업로드 대역이 좁아 체감 차이가 큽니다.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── 백엔드로 넘기는 경로 ────────────────────────────────
    # /api  : REST
    # /admin·/static : Django 관리 화면과 그 정적 파일
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 이 헤더가 없으면 Django 가 요청을 http 로 보고 admin 로그인이 순환합니다.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # ReAct 검색과 LLM 호출은 느립니다. gunicorn 의 120초와 맞춥니다.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── 정적 자산 ───────────────────────────────────────────
    # Vite 가 파일명에 해시를 붙이므로 내용이 바뀌면 이름이 바뀝니다.
    # 길게 캐시해도 낡은 파일이 남지 않습니다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA 폴백 ────────────────────────────────────────────
    # /flow-board 로 직접 들어오면 그런 파일이 없어 404 가 됩니다.
    # 라우팅은 브라우저에서 하므로 index.html 을 돌려줘야 합니다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 은 캐시하지 않습니다. 이것까지 캐시되면 새 배포가
    # 낡은 해시를 가리켜 화면이 안 바뀝니다.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
