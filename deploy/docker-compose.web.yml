# Bordo 프론트 정적 서빙.
#
#   docker compose -f deploy/docker-compose.web.yml up -d
#
# 서버의 apt 소스 설정이 깨져 있어 nginx 를 네이티브로 설치하지 않습니다.
# 그 설정은 다른 프로젝트가 쓰는 것이라 고치지 않기로 했습니다.

name: bordo-web

services:
  web:
    image: nginx:1.29-alpine
    container_name: bordo-web
    restart: unless-stopped

    # 호스트 네트워크를 씁니다. 컨테이너 안에서 127.0.0.1:8010(백엔드)로
    # 프록시해야 하는데, 브리지 네트워크로는 호스트의 루프백에 닿지 않습니다.
    network_mode: host

    volumes:
      - ${BORDO_FRONTEND_DIR:-./dist}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8020/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
